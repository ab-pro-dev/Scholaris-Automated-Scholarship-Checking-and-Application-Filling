name: scholaris

services:
  # ==========================================
  # PostgreSQL 16 Relational Database
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: scholaris-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scholaris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scholaris}
      POSTGRES_DB: ${POSTGRES_DB:-scholaris}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scholaris -d scholaris"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - scholaris-network

  # ==========================================
  # Redis 7 In-Memory Cache & BullMQ Queue
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: scholaris-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - scholaris-network

  # ==========================================
  # MinIO S3-Compatible Object Storage
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: scholaris-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000" # S3 API endpoint
      - "9001:9001" # Web Management Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - scholaris-network

  # Provision Default Private Document Bucket
  minio-init:
    image: minio/mc:latest
    container_name: scholaris-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      mc alias set localminio http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing localminio/scholaris-documents;
      echo 'MinIO private bucket scholaris-documents initialized.';
      exit 0;
      "
    networks:
      - scholaris-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  scholaris-network:
    driver: bridge
