name: scholaris

services:
  # ==========================================
  # PostgreSQL 16 Relational Database
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: scholaris-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scholaris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scholaris}
      POSTGRES_DB: ${POSTGRES_DB:-scholaris}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scholaris -d scholaris"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - scholaris-network

  # ==========================================
  # Redis 7 In-Memory Cache & BullMQ Queue
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: scholaris-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - scholaris-network

  # ==========================================
  # S3-Compatible Object Storage (MinIO / Silo)
  # ==========================================
  minio:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    container_name: scholaris-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000" # S3 API endpoint
      - "9001:9001" # Web Management Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || mc ready local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - scholaris-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  scholaris-network:
    driver: bridge
